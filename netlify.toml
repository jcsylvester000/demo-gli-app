# Next.js on Netlify needs the Next.js Runtime. It is pinned explicitly (auto-detection can be skipped,
# which serves a bare 404 on every URL).
[build]
  # Creates/updates database tables (idempotent), then builds.
  command = "npm run build:netlify"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Environment variables (Netlify → Site configuration → Environment variables). Never commit values.
#   DATABASE_URL            Neon *pooled* connection string                       (required)
#   IP_HASH_SALT            random string, used to rate-limit forms               (required from Batch 4)
#   NEXT_PUBLIC_GTM_ID      Google Tag Manager container, e.g. GTM-XXXXXXX        (optional; banner + GTM off without it)
# Lead capture (Batch 4):
#   RESEND_API_KEY          Resend API key (transactional email)                    (needed to send emails)
#   LEAD_FROM_EMAIL         e.g. "GLI Job Tickets <tickets@your-domain>" (domain verified in Resend: SPF/DKIM/DMARC)
#   SALES_INBOX             comma-separated inboxes that receive new tickets
#   NEXT_PUBLIC_TURNSTILE_SITE_KEY + TURNSTILE_SECRET_KEY   Cloudflare Turnstile (test keys are used until set)
#   CRON_SECRET             16+ random characters: lets the 15-minute retry job resend queued emails
#   TEAM_ALERT_WEBHOOK_URL  optional Slack-compatible webhook for instant team alerts
# Uploads use Netlify Blobs (store "quote-uploads"): nothing to configure.
# Admin (Batch 5):
#   BETTER_AUTH_SECRET      32+ random characters (e.g. openssl rand -base64 36)               (required)
#   BETTER_AUTH_URL         the site's public URL, e.g. https://gli.netlify.app (no trailing slash) (required)
#   ADMIN_INITIAL_PASSWORD  optional: first Admin's temporary password (default "Admin1234", must be changed at first sign-in)
#   ADMIN_RECOVERY_USERNAME lock-out recovery only: with ADMIN_INITIAL_PASSWORD, resets that user once on the next build; remove after
# Optional SEO: INDEXNOW_KEY (8-128 letters/digits) pings Bing & co. when content is published (real domain only).
# Real domain only: ALLOW_INDEXING = true and NEXT_PUBLIC_SITE_URL = https://your-domain
# (deploy previews and *.netlify.app stay noindex automatically).

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Illustrative stock photos (src/content/stock.ts) go through Netlify Image CDN.
[images]
  remote_images = ["https://images.unsplash.com/photo-.*"]
